# The container may run as an arbitrary non-root UID in Kubernetes.
# In that case Nginx keeps its existing user, so do not use `user nginx`.
worker_processes  1;

# Docker log collectors (including Loki Docker drivers) read stderr/stdout, not
# files in the container.
error_log  /dev/stderr warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    types {
        # The default MIME types file doesn't assign "application/javascript"
        # to "*.mjs" files (ECMAScript modules)
        application/javascript mjs;
    }

    # One JSON object per completed request. This is written to container
    # stdout so Docker/Loki collects it, and can be parsed with LogQL's
    # `| json`. The normalized URI supports endpoint queries without logging
    # query-string values from the original request line.
    log_format rdm_json escape=json '{'
        '"timestamp":"$time_iso8601",'
        '"status":$status,'
        '"request_method":"$request_method",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"remote_addr":"$remote_addr",'
        '"uri":"$uri",'
        '"upstream_http_x_user_id":"$upstream_http_x_user_id",'
        '"upstream_http_x_session_id":"$upstream_http_x_session_id",'
        '"upstream_status":"$upstream_status",'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_length":$request_length,'
        '"request_time":$request_time,'
        '"upstream_connect_time":"$upstream_connect_time",'
        '"upstream_header_time":"$upstream_header_time",'
        '"upstream_response_time":"$upstream_response_time",'
        '"http_referer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"request_id":"$request_id"'
    '}';

    access_log off;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;

    keepalive_timeout  65;

    gzip on;
    gzip_disable "msie6";
    gzip_http_version 1.1;
    gzip_comp_level 5; # or anything between 4-6
    gzip_min_length 100;
    gzip_proxied any;
    # We may need more mime-types here (eg. 'application/x-bibtex')
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/ld+json
        application/manifest+json
        application/octet-stream
        application/rss+xml
        application/vnd.geo+json
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-javascript
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        application/xml+rss
        font/opentype
        image/bmp
        image/svg+xml
        image/x-icon
        text/cache-manifest
        text/css
        text/javascript
        text/plain
        text/vcard
        text/vnd.rim.location.xloc
        text/vtt
        text/x-component
        text/x-cross-domain-policy
        text/xml;
    gzip_vary on;

    include /etc/nginx/conf.d/*.conf;
}
