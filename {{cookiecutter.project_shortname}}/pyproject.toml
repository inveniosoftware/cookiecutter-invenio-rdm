{%- set project_shortname = cookiecutter.project_shortname -%}
{%- set app_rdm_version = "~=15.0.0b2.dev0" -%}
{%- set app_rdm_base = "invenio-app-rdm" ~ app_rdm_version -%}
{%- set app_rdm_extras = ['opensearch2'] -%}
{%- if cookiecutter.file_storage == 'S3' -%}
  {%- set app_rdm_extras = app_rdm_extras + ['s3'] -%}
{%- endif -%}
{%- set instance_dist_name = (cookiecutter.project_name | slugify()) + '-instance' -%}
{%- if cookiecutter.site_code == 'yes' -%}
  {%- set site_dist_name = cookiecutter.project_shortname -%}
{%- endif -%}

[project]
name = "{{ instance_dist_name }}"
description = "Add your description here"
readme = "README.md"
version = "{{ app_rdm_version | replace('~=', '') }}"
requires-python = "~= 3.14.0"

dependencies = [
  "invenio-app-rdm{% if app_rdm_extras %}[{{ app_rdm_extras | join(',') }}]{% endif %}{{ app_rdm_version }}",
  "uwsgi>=2.0",
  "uwsgitop>=0.11",
  "uwsgi-tools>=1.1.1",
  "lxml-html-clean>=0.1.1",
  {% if cookiecutter.site_code == 'yes' -%}
  "{{ site_dist_name }}",
  {%- endif %}
]

{% if cookiecutter.site_code == 'yes' -%}
[tool.uv.sources]
"{{ site_dist_name }}" = { workspace = true }

[tool.uv.workspace]
members = ["site"]
{%- endif %}

[project.optional-dependencies]
tests = [
  "pytest-invenio>=4.0.0,<5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.uv]
exclude-newer = "7 days"

[tool.uv.exclude-newer-package]
flask-security-invenio = false
invenio-access = false
invenio-accounts = false
invenio-administration = false
invenio-app = false
invenio-app-rdm = false
invenio-assets = false
invenio-audit-logs = false
invenio-banners = false
invenio-base = false
invenio-cache = false
invenio-celery = false
invenio-checks = false
invenio-collections = false
invenio-communities = false
invenio-config = false
invenio-db = false
invenio-drafts-resources = false
invenio-files-rest = false
invenio-formatter = false
invenio-i18n = false
invenio-indexer = false
invenio-jobs = false
invenio-jsonschemas = false
invenio-logging = false
invenio-mail = false
invenio-notifications = false
invenio-oaiserver = false
invenio-oauth2server = false
invenio-oauthclient = false
invenio-pages = false
invenio-pidstore = false
invenio-previewer = false
invenio-rdm-records = false
invenio-records = false
invenio-records-files = false
invenio-records-permissions = false
invenio-records-resources = false
invenio-records-rest = false
invenio-records-ui = false
invenio-requests = false
invenio-rest = false
{% if cookiecutter.file_storage == 'S3' -%}
invenio-s3 = false
{% endif -%}
invenio-search = false
invenio-search-ui = false
invenio-sitemap = false
invenio-stats = false
invenio-theme = false
invenio-userprofiles = false
invenio-users-resources = false
invenio-vocabularies = false
jsonresolver = false
marshmallow-utils = false
pynpm = false
pywebpack = false
